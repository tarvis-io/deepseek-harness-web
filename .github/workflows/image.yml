name: image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dsh_ref:
        description: Upstream deepseek-harness ref to build (default from the Dockerfile)
        required: false
      publish_tag:
        description: Review image tag; manual runs never update latest
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            ${{ inputs.dsh_ref && format('DSH_REF={0}', inputs.dsh_ref) || '' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: Smoke test
        run: |
          set -eu
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker run -d --name dsh -p 127.0.0.1:3080:3080 \
            -e DSH_TRUSTED_HOSTS=dsh.test \
            -e GITHUB_TOKEN=test-github-token \
            -e GITLAB_TOKEN=test-gitlab-token "$ref"
          for i in $(seq 1 90); do
            docker logs dsh 2>&1 | grep -q 'dsh web: http' && break
            sleep 1
          done
          docker logs dsh
          docker logs dsh 2>&1 | grep -q 'dsh web: http://127.0.0.1:3080/?token='
          docker logs dsh 2>&1 | grep -E 'sandbox backends: .*landlock=(full|partial)'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/)
          test "$code" = 401
          token_url=$(docker logs dsh 2>&1 | grep -o 'http://127.0.0.1:3080/?token=[A-Za-z0-9_-]*' | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' -c cookies "$token_url")
          test "$code" = 303
          code=$(curl -s -o /dev/null -w '%{http_code}' -b cookies http://127.0.0.1:3080/)
          test "$code" = 200
          docker exec dsh sh -lc '
            test "$(git config --global --get credential.https://github.com.helper)" = /usr/local/bin/git-credential-env
            test "$(git config --global --get credential.https://gitlab.com.helper)" = /usr/local/bin/git-credential-env
            github=$(printf "protocol=https\nhost=github.com\n\n" | git credential fill)
            test "$github" = "protocol=https
          host=github.com
          username=x-access-token
          password=test-github-token"
            gitlab=$(printf "protocol=https\nhost=gitlab.com\n\n" | git credential fill)
            test "$gitlab" = "protocol=https
          host=gitlab.com
          username=oauth2
          password=test-gitlab-token"
            ! grep -R -q "test-github-token\|test-gitlab-token" "$HOME/.gitconfig" /workspace 2>/dev/null
          '
          node scripts/smoke-remote-settings.mjs dsh
          docker rm -f dsh
          echo "image size: $(docker image inspect -f '{{.Size}}' "$ref" | awk '{printf "%.2f GB", $1/1024/1024/1024}')"
      - name: Export digest
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: digests/*
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch tags
        run: |
          set -eu
          dsh_ref="${{ inputs.dsh_ref }}"
          if [ -z "$dsh_ref" ]; then
            dsh_ref=$(sed -n 's/^ARG DSH_REF=//p' Dockerfile | head -1)
          fi
          refs=$(cd digests && printf "${IMAGE}@sha256:%s " *)
          short=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            inspect_tag=latest
            tags=(-t "${IMAGE}:latest" -t "${IMAGE}:${dsh_ref}" -t "${IMAGE}:sha-${short}")
          else
            inspect_tag="${{ inputs.publish_tag }}"
            if [ -z "$inspect_tag" ]; then
              inspect_tag="sha-${short}"
            fi
            if ! [[ "$inspect_tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "invalid publish_tag: $inspect_tag" >&2
              exit 1
            fi
            tags=(-t "${IMAGE}:${inspect_tag}" -t "${IMAGE}:sha-${short}")
          fi
          docker buildx imagetools create "${tags[@]}" $refs
          docker buildx imagetools inspect "${IMAGE}:${inspect_tag}"
